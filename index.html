<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My, Your, His, Her — игра</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 15px;
  }
  .game {
    background: #fff; border-radius: 25px; padding: 30px;
    max-width: 650px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    text-align: center;
  }
  h1 { color: #764ba2; font-size: 26px; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
  .progress-bar {
    height: 14px; background: #eee; border-radius: 10px;
    overflow: hidden; margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width .4s ease;
  }
  .stats {
    display: flex; justify-content: space-between;
    font-size: 14px; color: #666; margin-bottom: 20px;
  }
  .question-box {
    background: #f4f1ff; border-radius: 20px;
    padding: 25px 20px; margin-bottom: 20px;
    min-height: 140px; display: flex;
    flex-direction: column; justify-content: center;
  }
  .emoji { font-size: 46px; margin-bottom: 10px; }
  .question {
    font-size: 20px; color: #333; line-height: 1.5;
  }
  .blank {
    display: inline-block; min-width: 70px;
    border-bottom: 3px dashed #764ba2;
    color: #764ba2; font-weight: bold;
  }
  .hint { font-size: 14px; color: #999; margin-top: 8px; font-style: italic; }
  .options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 15px;
  }
  .option {
    padding: 16px; border: 3px solid #ddd; border-radius: 15px;
    background: #fff; font-size: 20px; font-weight: bold;
    cursor: pointer; transition: all .2s; color: #444;
    font-family: inherit;
  }
  .option:hover:not(:disabled) {
    border-color: #667eea; transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(102,126,234,.3);
  }
  .option.correct {
    background: #4caf50; color: #fff; border-color: #4caf50;
    animation: pop .4s;
  }
  .option.wrong {
    background: #f44336; color: #fff; border-color: #f44336;
    animation: shake .4s;
  }
  .option:disabled { cursor: default; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)} }
  .feedback {
    font-size: 17px; font-weight: bold; min-height: 28px;
    margin-bottom: 15px;
  }
  .feedback.good { color: #4caf50; }
  .feedback.bad { color: #f44336; }
  .next-btn {
    padding: 14px 40px; border: none; border-radius: 30px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff; font-size: 18px; font-weight: bold;
    cursor: pointer; font-family: inherit;
    transition: transform .2s; display: none;
  }
  .next-btn:hover { transform: scale(1.05); }
  .screen { display: none; }
  .screen.active { display: block; }
  .final-emoji { font-size: 70px; margin: 15px 0; }
  .final-title { font-size: 28px; color: #764ba2; margin-bottom: 10px; }
  .final-score { font-size: 22px; color: #555; margin-bottom: 20px; }
  .restart-btn {
    padding: 15px 45px; border: none; border-radius: 30px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff; font-size: 18px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  .restart-btn:hover { transform: scale(1.05); }
  .rule { font-size: 15px; color: #666; line-height: 1.8; text-align: left;
    background: #f4f1ff; padding: 15px; border-radius: 15px; margin: 15px 0; }
  .rule b { color: #764ba2; }
</style>
</head>
<body>
<div class="game">

  <!-- СТАРТОВЫЙ ЭКРАН -->
  <div class="screen active" id="startScreen">
    <h1>🎮 My, Your, His, Her</h1>
    <p class="subtitle">Притяжательные местоимения · 3 класс</p>
    <div class="rule">
      <b>my</b> — мой &nbsp;|&nbsp; <b>your</b> — твой &nbsp;|&nbsp; <b>his</b> — его (мальчик)<br>
      <b>her</b> — её (девочка) &nbsp;|&nbsp; <b>its</b> — его/её (животное)<br>
      <b>our</b> — наш &nbsp;|&nbsp; <b>their</b> — их
    </div>
    <p class="subtitle">10 вопросов. Выбери правильное слово!</p>
    <button class="restart-btn" onclick="startGame()">▶ Начать игру</button>
  </div>

  <!-- ЭКРАН ИГРЫ -->
  <div class="screen" id="gameScreen">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="stats">
      <span id="questionNum">Вопрос 1 / 10</span>
      <span id="scoreDisplay">⭐ 0</span>
    </div>

    <div class="question-box">
      <div class="emoji" id="emoji">📚</div>
      <div class="question" id="questionText"></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Дальше →</button>
  </div>

  <!-- ФИНАЛЬНЫЙ ЭКРАН -->
  <div class="screen" id="endScreen">
    <div class="final-emoji" id="finalEmoji">🏆</div>
    <div class="final-title" id="finalTitle">Молодец!</div>
    <div class="final-score" id="finalScore"></div>
    <button class="restart-btn" onclick="startGame()">🔄 Играть снова</button>
  </div>

</div>

<script>
const questions = [
  { emoji:"📖", text:"This is ___ book.", hint:"Это МОЯ книга.", options:["my","his"], correct:"my" },
  { emoji:"👦🐶", text:"Tom has a dog. ___ dog is big.", hint:"Том — мальчик.", options:["Her","His"], correct:"His" },
  { emoji:"👧🐱", text:"Anna has a cat. ___ cat is white.", hint:"Анна — девочка.", options:["His","Her"], correct:"Her" },
  { emoji:"🏠", text:"We have a house. ___ house is red.", hint:"We = мы.", options:["Our","Their"], correct:"Our" },
  { emoji:"🧸🧸", text:"The children have toys. ___ toys are new.", hint:"The children = они (дети).", options:["Our","Their"], correct:"Their" },
  { emoji:"✏️", text:"You have a pen. Is this ___ pen?", hint:"You = ты.", options:["your","her"], correct:"your" },
  { emoji:"⚽", text:"I have a ball. ___ ball is blue.", hint:"I = я.", options:["My","Your"], correct:"My" },
  { emoji:"🚲", text:"He has a bike. ___ bike is fast.", hint:"He = он.", options:["Her","His"], correct:"His" },
  { emoji:"🐕", text:"The dog wags ___ tail.", hint:"Собака — это оно (животное).", options:["its","their"], correct:"its" },
  { emoji:"🌳", text:"We have a garden. ___ garden is big.", hint:"We = мы.", options:["Their","Our"], correct:"Our" }
];

let current = 0;
let score = 0;
let answered = false;

const $ = id => document.getElementById(id);

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function startGame() {
  current = 0; score = 0;
  showScreen('gameScreen');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = questions[current];
  $('emoji').textContent = q.emoji;
  // подставляем пустую линию в текст
  $('questionText').innerHTML = q.text.replace('___', '<span class="blank">?</span>');
  $('hint').textContent = q.hint;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('nextBtn').style.display = 'none';
  $('questionNum').textContent = `Вопрос ${current+1} / ${questions.length}`;
  $('scoreDisplay').textContent = `⭐ ${score}`;
  $('progress').style.width = (current / questions.length * 100) + '%';

  // перемешиваем варианты
  const opts = [...q.options].sort(() => Math.random() - 0.5);
  const box = $('options');
  box.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt);
    box.appendChild(btn);
  });
}

function checkAnswer(btn, chosen) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const allBtns = document.querySelectorAll('.option');

  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
  });

  if (chosen === q.correct) {
    score++;
    $('feedback').textContent = '✅ Правильно! Молодец!';
    $('feedback').className = 'feedback good';
    $('scoreDisplay').textContent = `⭐ ${score}`;
  } else {
    btn.classList.add('wrong');
    $('feedback').textContent = `❌ Правильный ответ: ${q.correct}`;
    $('feedback').className = 'feedback bad';
  }

  // показать правильное слово в тексте
  $('questionText').innerHTML = q.text.replace('___',
    `<span class="blank" style="color:#4caf50;border-color:#4caf50">${q.correct}</span>`);

  $('nextBtn').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    endGame();
  }
}

function endGame() {
  showScreen('endScreen');
  const total = questions.length;
  $('finalScore').textContent = `Твой результат: ${score} из ${total}`;
  if (score === total) {
    $('finalEmoji').textContent = '🏆';
    $('finalTitle').textContent = 'Отлично! Ты знаток местоимений!';
  } else if (score >= total * 0.7) {
    $('finalEmoji').textContent = '🌟';
    $('finalTitle').textContent = 'Хорошо! Почти отлично!';
  } else if (score >= total * 0.4) {
    $('finalEmoji').textContent = '👍';
    $('finalTitle').textContent = 'Неплохо! Повтори правило и попробуй снова.';
  } else {
    $('finalEmoji').textContent = '📚';
    $('finalTitle').textContent = 'Не расстраивайся! Повтори правило и попробуй ещё.';
  }
}
</script>
</body>
</html>
